# Local service stack (M6 + M7). Operated by the repository owner.
#
#   docker compose up -d qdrant          # vector store only (M7 RAG)
#   docker compose up -d db redis        # persistence/queue infrastructure (M6)
#   docker compose run --rm api uv run alembic upgrade head   # apply migrations
#   docker compose up api worker         # application
#
# The offline core, tests, and `ai-eval demo` need NONE of this — they run on SQLite with no
# services. This stack exists for the persistence/API/worker deployment and RAG integration.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Qdrant's container has no curl/wget; use the TCP bash check instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10


  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_eval
      POSTGRES_PASSWORD: ai_eval
      POSTGRES_DB: ai_eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_eval"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ai_eval:ai_eval@db:5432/ai_eval
      REDIS_URL: redis://redis:6379/0
      AI_EVAL_EXECUTION_MODE: celery
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["uv", "run", "celery", "-A", "ai_eval.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://ai_eval:ai_eval@db:5432/ai_eval
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
